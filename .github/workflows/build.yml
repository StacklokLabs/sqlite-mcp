name: Build artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task install

      - name: Build
        run: task build

      - name: Test
        run: task test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-mcp
          path: build/sqlite-mcp
          retention-days: 7